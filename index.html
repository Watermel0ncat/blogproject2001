<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Blog</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>My Blog</h3>

  <button data-page="home">Home</button>
  <button data-page="posts">Posts</button>
  <button data-page="admin">Admin</button>
  <button data-page="clock">Clock</button>
  <button data-page="preview">Preview</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- HOME -->
  <div id="home" class="page">
    <div class="card">
      <h2>Welcome</h2>
      <p>Simple personal blog.</p>
    </div>
  </div>

  <!-- POSTS -->
  <div id="posts" class="page hidden">
    <div class="card">
      <h2>Posts</h2>
      <div id="postList"></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="page hidden">
    <div class="card">
      <h2>Admin Panel</h2>

      <div id="editor" class="hidden">
        <input id="title" placeholder="Title" />
        <textarea id="content" placeholder="Write post..."></textarea>
        <button id="publishBtn">Publish</button>
      </div>

      <p id="status">Not logged in</p>
      <button id="loginBtn">Login</button>
    </div>
  </div>

  <!-- CLOCK -->
  <div id="clock" class="page hidden">
    <div class="card">
      <h2>Pacific Time</h2>
      <h1 id="time"></h1>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="page hidden">
    <div class="card">
      <h2>Web Preview</h2>

      <input id="urlInput" placeholder="https://..." />
      <button id="loadPreviewBtn">Load</button>

      <br /><br />

      <iframe id="previewFrame"></iframe>
    </div>
  </div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Admin Login</h3>

    <input type="password" id="pass" placeholder="Password" />

    <button id="enterBtn">Enter</button>
    <button id="cancelBtn">Cancel</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
